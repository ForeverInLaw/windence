name: windence-review
services:
  broker:
    build: .
    container_name: windence-review-broker
    restart: unless-stopped
    ports:
      - "127.0.0.1:18079:8080"
    volumes:
      - /var/lib/windence-review:/data
    environment:
      STATE_PATH: /data/session.json
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    logging:
      options: {max-size: "5m", max-file: "2"}
  https:
    image: caddy:2.11.7-alpine
    container_name: windence-review-https
    restart: unless-stopped
    ports:
      - "${BIND_IP:?Set BIND_IP in the local .env}:80:80"
      - "${BIND_IP:?Set BIND_IP in the local .env}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      options: {max-size: "5m", max-file: "2"}
volumes:
  caddy_data:
  caddy_config:
