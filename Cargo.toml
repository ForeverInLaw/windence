[package]
name = "spotify-gpui-client"
version = "1.2.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
anyhow = "1.0"
async-channel = "2.5"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6.0"
env_logger = "0.11"
futures = "0.3"
# The HTTP verb for the internal-protocol endpoints librespot's spclient has
# no helper for. Same major hyper (and so spclient) speaks; already in the
# graph through reqwest.
http = "1"
# The IANA name of the machine's time zone, which the Home feed sends so
# its greeting and time-of-day shelves match the listener's clock. Already
# in the graph through chrono's `clock` feature.
iana-time-zone = "0.1"
# The UI stack, packaged for crates.io: `gpui_kit::*` re-exports GPUI,
# `gpui_kit::component` the component library, `gpui_kit::assets` its default
# icon bundle (the fallback the app's asset source keeps for kit-internal
# requests).
gpui-kit = "0.6.1"
rust-embed = "8"
keyring = "4.1"
# Same protobuf major the vendored librespot 0.8 speaks: we parse its raw
# playlist/track messages (see proto_convert) instead of adapting to
# librespot's high-level metadata structs.
protobuf = "=3.7.2"
# Folder names arrive percent-encoded inside the rootlist's group markers.
# Already in the graph through `url`.
percent-encoding = "2.3"
librespot = { version = "0.8.0", default-features = false, features = ["native-tls"] }
rand = "0.8"
raw-window-handle = "0.6"
oauth2 = { version = "5.0", default-features = false, features = ["reqwest", "native-tls"] }
oauth2-reqwest = { package = "reqwest", version = "0.12", default-features = false, features = ["native-tls"] }
open = "5.3"
rspotify = { version = "0.16.0", default-features = false, features = ["client-reqwest", "reqwest-native-tls"] }
reqwest = { package = "gpui-pre-reqwest", version = "0.12.15", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
# The DJ's spoken lines arrive as MP3 from Spotify's TTS CDN. This is the
# same decoder librespot-playback already builds, pinned to the same
# minor, so no second copy of symphonia enters the graph.
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
serde_json = "1.0"
flate2 = "1"
# Audio output. The DJ narration path in src/audio.rs rides the same sink.
cpal = "0.18"
ringbuf = "0.5"
rubato = "5"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2.5"
souvlaki = { version = "0.8.3", default-features = false }
log = "0.4.33"
file-rotate = "0.8.0"

# gpui-kit's GPUI family (gpui-pre) tracks Zed's toolchain; keep in sync with
# https://github.com/zed-industries/zed/blob/main/rust-toolchain.toml

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = { version = "0.8.3", default-features = false, features = ["use_dbus"] }

[dev-dependencies]
# Headless GPUI test dispatcher (`HeadlessAppContext`, `#[gpui_kit::test]`).
gpui-kit = { version = "0.6.1", features = ["test-support"] }

[build-dependencies]
# Unused by us; this pin is a resolver constraint. librespot 0.8 builds through
# vergen-gitcl 1.0.8, whose spec (vergen ^9.0.6 + vergen-lib ^0.1.6) splits into
# two vergen-lib copies once vergen >= 9.1 resolves, failing librespot-core's
# build script with E0277 (librespot#1681, rustyhorde/vergen#478). Revisit when
# a librespot release moves past vergen-gitcl 1.x; until then vergen 10 is
# unreachable and Dependabot bumps of this line must be declined.
vergen = "=9.0.6"
# Pinned with the runtime it generates code for; the pure-Rust parser needs
# no protoc on the build machine.
protobuf-codegen = "=3.7.2"
winresource = "0.1.31"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
