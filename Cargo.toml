[package]
name = "spotify-gpui-client"
version = "0.4.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
anyhow = "1.0"
async-channel = "2.5"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6.0"
env_logger = "0.11"
futures = "0.3"
# The Zed rev is pinned by Cargo.lock, not here: gpui-component declares its
# Zed deps without a rev, and a rev of our own would split the graph into two
# checkouts with incompatible gpui types. Move the pin with
# `cargo update -p gpui --precise <rev>`, matching gpui-component's Cargo.lock.
gpui = { version = "=0.2.2", git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "14359a0cdd00657eb68fa946bfd99cd83c26e002" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "14359a0cdd00657eb68fa946bfd99cd83c26e002" }
keyring = "4.1"
# Same protobuf major the vendored librespot 0.8 speaks: we parse its raw
# playlist/track messages (see proto_convert) instead of adapting to
# librespot's high-level metadata structs.
protobuf = "=3.7.2"
librespot = { version = "0.8.0", default-features = false, features = ["native-tls"] }
rand = "0.8"
raw-window-handle = "0.6"
oauth2 = { version = "5.0", default-features = false, features = ["reqwest", "native-tls"] }
oauth2-reqwest = { package = "reqwest", version = "0.12", default-features = false, features = ["native-tls"] }
open = "5.3"
rspotify = { version = "0.16.0", default-features = false, features = ["client-reqwest", "reqwest-native-tls"] }
reqwest = { package = "zed-reqwest", version = "0.12.15-zed", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
# The DJ's spoken lines arrive as MP3 from Spotify's TTS CDN. This is the
# same decoder librespot-playback already builds, pinned to the same
# minor, so no second copy of symphonia enters the graph.
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
serde_json = "1.0"
flate2 = "1"
sdl2 = { version = "0.38", features = ["bundled", "static-link"] }
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2.5"
souvlaki = { version = "0.8.3", default-features = false }
log = "0.4.33"
file-rotate = "0.8.0"

# The GPUI platform crate's extra features are per-OS: font-kit is a macOS
# need, wayland/x11 are Linux needs; Windows ships Win32 + DirectWrite as
# defaults, so it takes the crate bare.

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["wayland", "x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed" }

[build-dependencies]
# Unused by us; this pin is a resolver constraint. librespot 0.8 builds through
# vergen-gitcl 1.0.8, whose spec (vergen ^9.0.6 + vergen-lib ^0.1.6) splits into
# two vergen-lib copies once vergen >= 9.1 resolves, failing librespot-core's
# build script with E0277 (librespot#1681, rustyhorde/vergen#478). Revisit when
# a librespot release moves past vergen-gitcl 1.x; until then vergen 10 is
# unreachable and Dependabot bumps of this line must be declined.
vergen = "=9.0.6"
winresource = "0.1.31"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
