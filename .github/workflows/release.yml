name: Release

# Manual runs build the first Store upload and development artifacts.
# Stable tags submit Store updates only after the owner enables Store delivery.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: Successful Release run to compare native onboarding (optional)
        required: false
        type: string
        default: ""

permissions:
  contents: read

# A release must never be cut in half, so a second run waits instead of
# cancelling the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Nothing is reused between runs, so incremental artifacts are pure cache
  # weight.
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  windows:
    name: Windows x64
    # Pinned rather than `windows-latest`. This image carries the Rust 1.97.1
    # that rust-toolchain.toml asks for, plus Inno Setup and the Visual Studio
    # redistributable the packaging script needs, so the job installs none of
    # them.
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      actions: read # download the optional baseline artifact
      id-token: write # sign the build provenance
      attestations: write # store it
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release notes read the whole history
          persist-credentials: false

      # Restores the compiled dependencies. gpui, librespot and SQLite
      # all build from source, so a cold run is most of this job's time.
      - name: Restore the Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64-release
          cache-on-failure: true

      - name: Check Store submission guards
        run: scripts\test-store-submission.ps1

      - name: Build the installer and the zip
        run: |
          # On a manual run the ref is a branch, and there is no tag to check.
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          scripts\package-windows.ps1 -ExpectedVersion $tag

      - name: Package for Microsoft Store
        if: github.ref_type != 'tag' || !contains(github.ref_name, '-')
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          scripts\package-msix.ps1 -SkipBuild -ExpectedVersion $tag

      - name: Validate package installation and onboarding
        if: github.ref_type != 'tag' || !contains(github.ref_name, '-')
        run: |
          $package = @(Get-ChildItem dist\store -Filter '*.msix')
          if ($package.Count -ne 1) { throw 'Expected one Store package' }
          powershell.exe -NoProfile -File scripts\test-msix.ps1 -PackagePath $package[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'MSIX installation or onboarding failed' }

      - name: Upload Store package for Partner Center
        if: github.ref_type != 'tag' || !contains(github.ref_name, '-')
        uses: actions/upload-artifact@v7
        with:
          name: windence-store-x64
          path: dist/store/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: cadence-windows-x64
          path: dist/development/Cadence-*
          if-no-files-found: error
          retention-days: 14

      - name: Capture native onboarding
        id: native_capture
        if: github.event_name == 'workflow_dispatch' && inputs.baseline_run_id != ''
        continue-on-error: true
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
        run: |
          $zip = @(Get-ChildItem dist\development -File -Filter 'Cadence-*-windows-x64.zip')
          if ($zip.Count -ne 1) { throw 'Expected one packaged Windows ZIP' }
          powershell.exe -NoProfile -File scripts\capture-windows-ui.ps1 `
            -BaselineRunId $env:BASELINE_RUN_ID -FinalZip $zip[0].FullName `
            -OutputDirectory "$env:RUNNER_TEMP\cadence-native-ui"
          if ($LASTEXITCODE -ne 0) { throw 'Native capture failed; see its report artifact' }

      - name: Upload native capture report
        if: always() && steps.native_capture.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: cadence-native-onboarding
          path: ${{ runner.temp }}/cadence-native-ui
          if-no-files-found: warn
          retention-days: 14

      # Lets anyone confirm the download was built here, from this commit:
      #   gh attestation verify <file> --repo ForeverInLaw/windence
      - name: Attest the Store package
        if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/store/*.msix

  store:
    name: Submit Microsoft Store update
    needs: windows
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-') && vars.STORE_PUBLISH_ENABLED == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    environment: store
    concurrency:
      group: microsoft-store-stable
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release from the Windows branch
        run: |
          git merge-base --is-ancestor HEAD origin/windows-port
          if ($LASTEXITCODE -ne 0) { throw 'Merge into windows-port before tagging a Store release' }
      - uses: actions/download-artifact@v7
        with:
          name: windence-store-x64
          path: dist/store
      - name: Install the Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.3
      - name: Check identity and submit the stable package
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $package = @(Get-ChildItem dist\store -Filter '*.msix')
          if ($package.Count -ne 1) { throw 'Expected one Store artifact' }
          scripts\publish-store.ps1 -PackagePath $package[0].FullName -ExpectedVersion $env:RELEASE_TAG
