name: Retry Microsoft Store delivery

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Release run with a successful Windows build and failed Store delivery
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  retry:
    if: github.ref == 'refs/heads/windows-port'
    runs-on: windows-2025
    timeout-minutes: 45
    environment: store
    concurrency:
      group: microsoft-store-stable
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a verified stable Release build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_RUN_ID -notmatch '^[1-9][0-9]*$') { throw 'Invalid run ID' }
          $root = "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID"
          $run = gh api $root | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the source run' }
          if ($run.path -ne '.github/workflows/release.yml' -or $run.event -ne 'push' -or
              $run.status -ne 'completed' -or $run.conclusion -ne 'failure' -or
              $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or
              $run.head_branch -notmatch '^v[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw 'Expected a failed stable Release run from this repository'
          }
          $jobs = gh api "$root/jobs?filter=latest&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the source jobs' }
          if (@($jobs.jobs | Where-Object { $_.name -eq 'Windows x64' -and $_.conclusion -eq 'success' }).Count -ne 1 -or
              @($jobs.jobs | Where-Object { $_.name -eq 'Submit Microsoft Store update' -and $_.conclusion -eq 'failure' }).Count -ne 1) {
              throw 'Require a successful Windows build and failed Store submission'
          }
          $commit = git rev-parse "$($run.head_branch)^{commit}"
          if ($LASTEXITCODE -ne 0 -or $commit -ne $run.head_sha) { throw 'Source tag does not match the built commit' }
          git merge-base --is-ancestor $commit origin/windows-port
          if ($LASTEXITCODE -ne 0) { throw 'Source release must be merged into windows-port' }
          "RELEASE_TAG=$($run.head_branch)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/download-artifact@v7
        with:
          name: windence-store-x64
          path: dist/store
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Install the Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.3
      - name: Retry the validated package with current delivery code
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          $package = @(Get-ChildItem dist\store -Filter '*.msix')
          if ($package.Count -ne 1) { throw 'Expected one Store artifact' }
          scripts\publish-store.ps1 -PackagePath $package[0].FullName -ExpectedVersion $env:RELEASE_TAG
