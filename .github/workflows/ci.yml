name: CI

on:
  push:
    branches: [windows-port, "integrate/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check Store submission guards
        run: scripts\test-store-submission.ps1
      - name: Check Store taskbar resources
        run: scripts\test-store-resources.ps1
      - name: Restore the Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64-ci
          save-if: ${{ github.event_name == 'push' }}
      - name: Build
        run: cargo build --locked
      - name: Check lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run portable tests
        run: cargo test --locked
