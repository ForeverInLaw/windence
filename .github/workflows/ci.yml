name: CI

on:
  push:
    branches: [windows-port, "integrate/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  review-broker:
    name: Review access service
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test token renewal and revocation
        run: |
          python3 -m venv "${{ runner.temp }}/review-broker"
          "${{ runner.temp }}/review-broker/bin/pip" install -r services/review-broker/requirements.txt
          "${{ runner.temp }}/review-broker/bin/python" -m unittest discover -s services/review-broker -p test_app.py -v

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Restore the Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64-ci
          save-if: ${{ github.event_name == 'push' }}
      - name: Build
        run: cargo build --locked
      - name: Check lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run portable tests
        run: cargo test --locked
      - name: Check review access helper
        run: scripts\test-review-access.ps1
